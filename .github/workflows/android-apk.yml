name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the VITE_API_URL repository variable to the deployed API URL before building a live Android APK."
            exit 1
          fi
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blinker-a-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk blinker-a.apk
          gh release create "$GITHUB_REF_NAME" blinker-a.apk \
            --title "Blinker-a $GITHUB_REF_NAME" \
            --notes "Android APK for sideload testing. This is a debug-signed build, not a Google Play release."
        env:
          GH_TOKEN: ${{ github.token }}
